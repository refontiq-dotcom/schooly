name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Tests · Lint · Build
    runs-on: ubuntu-latest
    env:
      # Uniquement pour le build : les pages statiques lisent ces variables à
      # l'initialisation du client Supabase. Valeurs factices non secrètes —
      # les vraies clés vivent en variables d'environnement de déploiement,
      # jamais dans le dépôt.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      SUPABASE_SECRET_KEY: placeholder-secret-key
      NEXT_PUBLIC_APP_URL: https://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation (workspaces npm)
        run: npm ci

      - name: Typecheck (tous les packages)
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Lint (bloquant)
        run: npm run lint

      - name: Build application admin
        run: npm run build:admin
